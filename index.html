<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Sanggar Parikesit</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML5 QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .print-area { display: none; }
        @media print {
            body * { visibility: hidden; }
            .print-area, .print-area * { visibility: visible; }
            .print-area { display: block; position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex h-screen overflow-hidden">

    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#7B1113] text-white flex flex-col shadow-xl z-20">
        <div class="p-5 flex items-center space-x-3 border-b border-red-900">
            <div class="bg-amber-500 p-2.5 rounded-xl text-slate-900 shadow-md">
                <i class="fa-solid fa-masks-theater text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold tracking-wide text-lg">PARIKESIT</h1>
                <p class="text-xs text-amber-200">SANGGAR SENI TRADISI</p>
            </div>
        </div>
        
        <nav class="flex-1 px-4 py-6 space-y-1.5 overflow-y-auto text-sm font-medium">
            <a href="#" onclick="switchTab('dashboard')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl bg-amber-500 text-slate-900 font-semibold shadow transition"><i class="fa-solid fa-chart-pie w-5"></i><span>Dashboard</span></a>
            
            <div class="pt-4 pb-2 text-[11px] font-bold uppercase tracking-wider text-red-300 px-4">FITUR ADMIN</div>
            <a href="#" onclick="switchTab('admin-pembina')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-red-100 hover:bg-red-900/50 transition"><i class="fa-solid fa-chalkboard-user w-5"></i><span>Data Pembina</span></a>
            <a href="#" onclick="switchTab('admin-rombel')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-red-100 hover:bg-red-900/50 transition"><i class="fa-solid fa-users-rectangle w-5"></i><span>Manajemen Rombel</span></a>

            <div class="pt-4 pb-2 text-[11px] font-bold uppercase tracking-wider text-red-300 px-4">PEMBELAJARAN & PRESENSI</div>
            <a href="#" onclick="switchTab('siswa')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-red-100 hover:bg-red-900/50 transition"><i class="fa-solid fa-id-card w-5"></i><span>Data Siswa & Kartu QR</span></a>
            <a href="#" onclick="switchTab('scan-absensi')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-red-100 hover:bg-red-900/50 transition"><i class="fa-solid fa-qrcode w-5"></i><span>Scan QR Absensi</span></a>
            <a href="#" onclick="switchTab('rekap-kehadiran')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-red-100 hover:bg-red-900/50 transition"><i class="fa-solid fa-clipboard-user w-5"></i><span>Rekap Kehadiran</span></a>
            <a href="#" onclick="switchTab('penilaian')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-red-100 hover:bg-red-900/50 transition"><i class="fa-solid fa-award w-5"></i><span>Penilaian Seni</span></a>
            <a href="#" onclick="switchTab('raport')" class="nav-link flex items-center space-x-3 px-4 py-3 rounded-xl text-red-100 hover:bg-red-900/50 transition"><i class="fa-solid fa-file-lines w-5"></i><span>Cetak Raport</span></a>
        </nav>

        <div class="p-4 border-t border-red-900 text-xs text-red-200">
            <p class="font-semibold">Sanggar Seni Parikesit</p>
            <p class="truncate opacity-75">Karanggayam, Kebumen</p>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between shadow-sm z-10">
            <div class="flex items-center space-x-4">
                <h2 id="page-title" class="text-xl font-bold text-slate-800">Dashboard Sanggar</h2>
            </div>
            <div class="flex items-center space-x-3">
                <label class="cursor-pointer bg-amber-100 text-amber-800 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-amber-200 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-image"></i>
                    <span>Upload Logo Kop</span>
                    <input type="file" id="logo-input" accept="image/*" class="hidden" onchange="uploadLogo(event)">
                </label>
                <div class="bg-red-50 border border-red-200 text-[#7B1113] px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1.5">
                    <i class="fa-solid fa-user-shield"></i>
                    <span>Administrator Utama</span>
                </div>
                <div class="bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center space-x-1.5">
                    <i class="fa-solid fa-cloud-arrow-up text-emerald-600"></i>
                    <span>Cloud Active</span>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-8 bg-slate-50 relative" id="main-content">
            <!-- Konten Dinamis -->
        </main>
    </div>

    <script>
        // URL GOOGLE SHEETS API TERBARU
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbypSxLK24qETz5Jr4iu0IAjXA9UZfn5FjzOKNzdcitCtn3qezGa010WwjmzaEpj9e_Elg/exec";

        let appData = {
            logo: '',
            siswa: [
                { nis: "2026001", nama: "Galang Prasetyo", peminatan: "Seni Karawitan", rombel: "Karawitan Dasar A", jk: "L" },
                { nis: "2026002", nama: "Dinda Lestari", peminatan: "Seni Tari", rombel: "Tari Dasar A", jk: "P" }
            ],
            pembina: [
                { id: "P01", nama: "Ki Sastro Utomo", bidang: "Seni Karawitan", telp: "081234567890", status: "Aktif" },
                { id: "P02", nama: "Nyi Rina Hastuti", bidang: "Seni Tari", telp: "085678901234", status: "Aktif" }
            ],
            rombel: [
                { nama: "Karawitan Dasar A", tingkat: "Tingkat Dasar (Pemula)", pembina: "Ki Sastro Utomo", bidang: "Seni Karawitan" },
                { nama: "Tari Dasar A", tingkat: "Tingkat Dasar (Pemula)", pembina: "Nyi Rina Hastuti", bidang: "Seni Tari" }
            ],
            absensi: []
        };

        async function loadCloudData() {
            try {
                const response = await fetch(GOOGLE_SHEETS_URL);
                const data = await response.json();
                
                if (data.siswa && data.siswa.length > 1) {
                    appData.siswa = data.siswa.slice(1).map(row => ({
                        nis: String(row[1]),
                        nama: row[2],
                        peminatan: row[3],
                        rombel: row[4],
                        jk: row[5]
                    }));
                }
                
                if (data.absensi && data.absensi.length > 1) {
                    appData.absensi = data.absensi.slice(1).map(row => ({
                        nis: String(row[1]),
                        nama: row[2],
                        tanggal: row[3],
                        waktu: row[4],
                        status: row[5]
                    }));
                }

                if (data.config && data.config.length > 1) {
                    const logoConfig = data.config.find(row => row[0] === 'sanggar_logo');
                    if (logoConfig) appData.logo = logoConfig[1];
                }
                renderDashboard();
            } catch (e) {
                console.log("Gagal memuat dari cloud, menggunakan data lokal:", e);
                renderDashboard();
            }
        }

        function syncToGoogleSheets(action, payload) {
            if (!GOOGLE_SHEETS_URL) return;
            fetch(GOOGLE_SHEETS_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ action, ...payload })
            }).catch(err => console.log("Cloud sync error:", err));
        }

        function uploadLogo(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    appData.logo = e.target.result;
                    syncToGoogleSheets("saveConfig", { key: 'sanggar_logo', value: appData.logo });
                    alert("Logo sanggar berhasil diunggah & tersimpan ke Cloud Google Sheets!");
                    renderDashboard();
                };
                reader.readAsDataURL(file);
            }
        }

        window.onload = function() {
            loadCloudData();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.nav-link').forEach(el => {
                el.classList.remove('bg-amber-500', 'text-slate-900', 'font-semibold', 'shadow');
                el.classList.add('text-red-100', 'hover:bg-red-900/50');
            });
            event.currentTarget.classList.add('bg-amber-500', 'text-slate-900', 'font-semibold', 'shadow');
            event.currentTarget.classList.remove('text-red-100', 'hover:bg-red-900/50');

            const titles = {
                'dashboard': 'Dashboard Sanggar',
                'admin-pembina': 'Data Guru Pembina',
                'admin-rombel': 'Manajemen Rombel & Tingkatan',
                'siswa': 'Data Siswa & Kartu QR Barcode',
                'scan-absensi': 'Absensi Kamera QR Real-time',
                'rekap-kehadiran': 'Rekap Kehadiran Siswa',
                'penilaian': 'Penilaian Seni Tari & Karawitan',
                'raport': 'Cetak Raport Resmi'
            };
            document.getElementById('page-title').innerText = titles[tabId] || 'Sanggar Parikesit';

            if (tabId === 'dashboard') renderDashboard();
            else if (tabId === 'siswa') renderSiswa();
            else if (tabId === 'scan-absensi') renderScanAbsensi();
            else if (tabId === 'rekap-kehadiran') renderRekapKehadiran();
            else if (tabId === 'raport') renderRaport();
            else document.getElementById('main-content').innerHTML = `<div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><h3 class="font-bold text-lg mb-2">${titles[tabId]}</h3><p class="text-sm text-slate-500">Modul aktif dan tersinkronisasi cloud.</p></div>`;
        }

        function renderDashboard() {
            document.getElementById('main-content').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                        <div><p class="text-xs font-bold text-slate-400 uppercase">Total Siswa</p><h3 class="text-2xl font-extrabold text-slate-800 mt-1">${appData.siswa.length}</h3></div>
                        <div class="bg-amber-100 text-amber-700 p-3.5 rounded-xl"><i class="fa-solid fa-users text-lg"></i></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                        <div><p class="text-xs font-bold text-slate-400 uppercase">Guru Pembina</p><h3 class="text-2xl font-extrabold text-slate-800 mt-1">${appData.pembina.length}</h3></div>
                        <div class="bg-red-100 text-[#7B1113] p-3.5 rounded-xl"><i class="fa-solid fa-chalkboard-user text-lg"></i></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                        <div><p class="text-xs font-bold text-slate-400 uppercase">Total Rombel</p><h3 class="text-2xl font-extrabold text-slate-800 mt-1">${appData.rombel.length}</h3></div>
                        <div class="bg-indigo-100 text-indigo-700 p-3.5 rounded-xl"><i class="fa-solid fa-users-rectangle text-lg"></i></div>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                        <div><p class="text-xs font-bold text-slate-400 uppercase">Cloud Storage</p><h3 class="text-lg font-bold text-emerald-600 mt-1">Google Sheets</h3></div>
                        <div class="bg-emerald-100 text-emerald-700 p-3.5 rounded-xl"><i class="fa-solid fa-cloud text-lg"></i></div>
                    </div>
                </div>
            `;
        }

        function renderSiswa() {
            let rows = appData.siswa.map(s => `
                <tr class="hover:bg-slate-50 border-b border-slate-100">
                    <td class="py-3 px-4 font-semibold text-slate-700">${s.nis}</td>
                    <td class="py-3 px-4 font-bold text-slate-900">${s.nama}</td>
                    <td class="py-3 px-4 text-slate-600">${s.peminatan}</td>
                    <td class="py-3 px-4 text-slate-600">${s.rombel}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="bukaKartuQR('${s.nis}', '${s.nama}', '${s.rombel}')" class="bg-amber-500 text-slate-900 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-amber-400 shadow-sm">
                            <i class="fa-solid fa-qrcode mr-1"></i> Cetak Kartu
                        </button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('main-content').innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-bold text-lg text-slate-800">Daftar Siswa Sanggar Parikesit</h3>
                        <button onclick="tambahSiswaModal()" class="bg-[#7B1113] text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-900 shadow">Tambah Siswa Baru</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
                                    <th class="py-3 px-4 rounded-l-xl">NIS</th>
                                    <th class="py-3 px-4">Nama Siswa</th>
                                    <th class="py-3 px-4">Peminatan</th>
                                    <th class="py-3 px-4">Rombel</th>
                                    <th class="py-3 px-4 text-center rounded-r-xl">Aksi QR</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                </div>
                <div id="qr-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
                    <div class="bg-white p-6 rounded-2xl shadow-xl w-80 text-center">
                        <h4 class="font-bold text-slate-800 mb-1">KARTU ANGGOTA</h4>
                        <p class="text-xs text-slate-500 mb-4">Sanggar Seni Parikesit</p>
                        <div id="qrcode-box" class="flex justify-center mb-4 p-4 bg-slate-50 rounded-xl border border-slate-200"></div>
                        <h5 id="modal-nama" class="font-bold text-slate-900 text-base"></h5>
                        <p id="modal-nis" class="text-xs text-slate-500 mb-4"></p>
                        <button onclick="document.getElementById('qr-modal').classList.add('hidden')" class="w-full bg-slate-200 text-slate-700 py-2 rounded-xl text-xs font-bold hover:bg-slate-300">Tutup</button>
                    </div>
                </div>
            `;
        }

        function tambahSiswaModal() {
            const nis = prompt("Masukkan NIS Siswa:");
            const nama = prompt("Masukkan Nama Lengkap Siswa:");
            const peminatan = prompt("Masukkan Peminatan (Seni Karawitan / Seni Tari):");
            const rombel = prompt("Masukkan Nama Rombel:");
            if (nis && nama) {
                const siswaBaru = { nis, nama, peminatan: peminatan || 'Seni Karawitan', rombel: rombel || 'Umum', jk: 'L' };
                appData.siswa.push(siswaBaru);
                syncToGoogleSheets("saveSiswa", { id: nis, nama, peminatan, rombel, jk: 'L' });
                renderSiswa();
                alert("Siswa berhasil ditambahkan & langsung tersimpan ke Google Sheets!");
            }
        }

        function bukaKartuQR(nis, nama, rombel) {
            document.getElementById('qr-modal').classList.remove('hidden');
            document.getElementById('modal-nama').innerText = nama;
            document.getElementById('modal-nis').innerText = `NIS: ${nis} • ${rombel}`;
            document.getElementById('qrcode-box').innerHTML = "";
            new QRCode(document.getElementById('qrcode-box'), { text: nis, width: 128, height: 128 });
        }

        function renderScanAbsensi() {
            document.getElementById('main-content').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="font-bold text-lg text-slate-800 mb-4">Scan QR Barcode Kamera</h3>
                        <div id="reader" class="w-full bg-slate-100 rounded-xl overflow-hidden mb-4 border border-slate-200"></div>
                        <button onclick="mulaiKamera()" class="w-full bg-[#7B1113] text-white py-3 rounded-xl font-bold text-sm shadow hover:bg-red-900">Aktifkan Kamera Scanner</button>
                    </div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 class="font-bold text-lg text-slate-800 mb-4">Log Kehadiran Tersimpan</h3>
                        <div id="log-absen" class="space-y-2 max-h-96 overflow-y-auto">
                            ${appData.absensi.slice(-10).reverse().map(a => `
                                <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-xl flex justify-between items-center text-sm">
                                    <div><span class="font-bold text-slate-900">${a.nama}</span> <span class="text-xs text-slate-500">(${a.nis})</span></div>
                                    <span class="text-xs bg-emerald-200 text-emerald-800 px-2 py-1 rounded font-bold">${a.tanggal} ${a.waktu}</span>
                                </div>
                            `).join('') || '<p class="text-sm text-slate-400 italic">Belum ada data absensi.</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function mulaiKamera() {
            const html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    const siswa = appData.siswa.find(s => s.nis === decodedText);
                    if (siswa) {
                        const waktu = new Date().toLocaleTimeString();
                        const tanggal = new Date().toLocaleDateString();
                        appData.absensi.push({ nis: siswa.nis, nama: siswa.nama, tanggal, waktu, status: 'Hadir' });
                        syncToGoogleSheets("saveAbsensi", { nis: siswa.nis, nama: siswa.nama, tanggal, waktu, status: 'Hadir' });
                        renderScanAbsensi();
                    }
                },
                (err) => {}
            ).catch(err => alert("Kamera tidak dapat diakses."));
        }

        function renderRekapKehadiran() {
            let rows = appData.siswa.map(s => {
                let hadir = appData.absensi.filter(a => a.nis === s.nis).length;
                return `
                    <tr class="border-b border-slate-100">
                        <td class="py-3 px-4 font-semibold text-slate-700">${s.nis}</td>
                        <td class="py-3 px-4 font-bold text-slate-900">${s.nama}</td>
                        <td class="py-3 px-4 text-slate-600">${s.rombel}</td>
                        <td class="py-3 px-4 text-center font-bold text-emerald-600">${hadir} Hadir</td>
                    </tr>
                `;
            }).join('');
            document.getElementById('main-content').innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h3 class="font-bold text-lg text-slate-800 mb-4">Rekapitulasi Kehadiran Siswa</h3>
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                                <th class="py-3 px-4 rounded-l-xl">NIS</th>
                                <th class="py-3 px-4">Nama Siswa</th>
                                <th class="py-3 px-4">Rombel</th>
                                <th class="py-3 px-4 text-center rounded-r-xl">Total Hadir</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            `;
        }

        function renderRaport() {
            let rows = appData.siswa.map(s => `
                <tr class="border-b border-slate-100">
                    <td class="py-3 px-4 font-semibold text-slate-700">${s.nis}</td>
                    <td class="py-3 px-4 font-bold text-slate-900">${s.nama}</td>
                    <td class="py-3 px-4 text-slate-600">${s.peminatan}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="downloadRaportPDF('${s.nis}')" class="bg-[#7B1113] text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-900 shadow-sm">
                            <i class="fa-solid fa-file-pdf mr-1"></i> Download PDF
                        </button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('main-content').innerHTML = `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h3 class="font-bold text-lg text-slate-800 mb-4">Pilih Siswa untuk Cetak Raport</h3>
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase text-xs">
                                <th class="py-3 px-4 rounded-l-xl">NIS</th>
                                <th class="py-3 px-4">Nama Siswa</th>
                                <th class="py-3 px-4">Peminatan</th>
                                <th class="py-3 px-4 text-center rounded-r-xl">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
                <div id="print-container" class="print-area"></div>
            `;
        }

        function downloadRaportPDF(nis) {
            const siswa = appData.siswa.find(s => s.nis === nis);
            const container = document.getElementById('print-container');
            const logoSrc = appData.logo || 'https://via.placeholder.com/80';
            
            container.innerHTML = `
                <div style="padding: 40px; font-family: 'Plus Jakarta Sans', sans-serif; background: #fff; color: #1e293b;">
                    <div style="display: flex; align-items: center; border-bottom: 3px double #7B1113; padding-bottom: 15px; margin-bottom: 25px;">
                        <img src="${logoSrc}" style="width: 75px; height: 75px; object-fit: contain; margin-right: 20px;" />
                        <div style="text-align: center; flex: 1;">
                            <h2 style="margin: 0; font-size: 20px; font-weight: bold; color: #7B1113;">SANGGAR SENI TRADISI PARIKESIT</h2>
